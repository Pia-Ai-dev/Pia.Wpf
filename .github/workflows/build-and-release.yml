name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: false
      bundle_chromium:
        description: 'Ship Chromium inside the installer (+~400 MB, no first-run download)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  id-token: write

# Every push to main cuts a release. Two pushes close together used to race: gh release
# create had no --target, so a slow-finishing run tagged whatever main's tip had become by
# the time it published rather than the commit it built. Queue instead of racing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install AzureSignTool
        run: dotnet tool install --global AzureSignTool

      - name: Restore packages
        run: dotnet restore src/Pia.Wpf/Pia.Wpf.csproj

      - name: Determine release info
        id: info
        shell: bash
        run: |
          dotnet tool restore
          VERSION=$(dotnet nbgv get-version -v SimpleVersion)
          DATE=$(date +%Y%m%d)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "title=Pia v${VERSION} (${DATE})" >> "$GITHUB_OUTPUT"
          BRANCH=${GITHUB_REF_NAME}
          if [ "$BRANCH" = "main" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish self-contained
        run: >
          dotnet publish src/Pia.Wpf/Pia.Wpf.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=false
          -o publish

      - name: Sign published Pia.Wpf.exe
        shell: pwsh
        run: |
          AzureSignTool sign `
            -kvu "${{ vars.AZURE_KEY_VAULT_URL }}" `
            -kvc "${{ vars.AZURE_CERT_NAME }}" `
            -kvm `
            -tr http://timestamp.digicert.com `
            -td sha256 `
            -fd sha256 `
            -v `
            publish/Pia.Wpf.exe

      # Off by default: the browser is otherwise downloaded on the first meeting join. Turning this on
      # puts a Chromium that updates and uninstalls with the app into the payload, at ~400 MB per
      # release (deltas absorb most of it) paid by every user, meeting attendee or not.
      - name: Bundle Chromium into the payload
        if: ${{ inputs.bundle_chromium }}
        shell: pwsh
        run: pwsh scripts/Save-RuntimeAssets.ps1 -Include Chromium -DestinationRoot publish

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --allow-roll-forward --prerelease

      - name: Download previous release (for delta updates)
        run: |
          vpk download github --repoUrl https://github.com/Pia-Ai-dev/Pia.Wpf --token ${{ secrets.GITHUB_TOKEN }} -x
        continue-on-error: true

      - name: Create Velopack release (per-machine MSI)
        run: >
          vpk pack
          -u Pia.Wpf
          -v ${{ steps.info.outputs.version }}
          -p publish
          --mainExe Pia.Wpf.exe
          --icon src/Pia.Wpf/Resources/Icons/Pia.ico
          --packTitle "Pia - Personal Intelligent Assistant"
          --packAuthors "neo42 GmbH"
          --instLicense src/Pia.Wpf/Resources/Installer/LICENSE.txt
          --msiBanner src/Pia.Wpf/Resources/Installer/banner.bmp
          --msiLogo src/Pia.Wpf/Resources/Installer/logo.bmp
          --instLocation PerMachine
          --msi
          --signTemplate "AzureSignTool sign -kvu ${{ vars.AZURE_KEY_VAULT_URL }} -kvc ${{ vars.AZURE_CERT_NAME }} -kvm -tr http://timestamp.digicert.com -td sha256 -fd sha256 {{file}}"

      - name: Create per-user MSI variant
        run: >
          vpk pack
          -u Pia.Wpf
          -v ${{ steps.info.outputs.version }}
          -p publish
          -o ReleasesUser
          --mainExe Pia.Wpf.exe
          --icon src/Pia.Wpf/Resources/Icons/Pia.ico
          --packTitle "Pia - Personal Intelligent Assistant"
          --packAuthors "neo42 GmbH"
          --instLicense src/Pia.Wpf/Resources/Installer/LICENSE.txt
          --msiBanner src/Pia.Wpf/Resources/Installer/banner.bmp
          --msiLogo src/Pia.Wpf/Resources/Installer/logo.bmp
          --instLocation PerUser
          --msi
          --signTemplate "AzureSignTool sign -kvu ${{ vars.AZURE_KEY_VAULT_URL }} -kvc ${{ vars.AZURE_CERT_NAME }} -kvm -tr http://timestamp.digicert.com -td sha256 -fd sha256 {{file}}"

      - name: Stage per-user MSI alongside per-machine artifacts
        shell: pwsh
        run: Move-Item ReleasesUser/Pia.Wpf-win.msi Releases/Pia.Wpf-win.User.msi -Force

      - name: Install git-cliff
        shell: pwsh
        run: |
          $version = "2.12.0"
          $url = "https://github.com/orhun/git-cliff/releases/download/v$version/git-cliff-$version-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile git-cliff.zip
          Expand-Archive git-cliff.zip -DestinationPath git-cliff-bin
          echo "$PWD\git-cliff-bin\git-cliff-$version" | Out-File -Append $env:GITHUB_PATH

      # A hand-written note beats a dump of every commit subject, so docs/release_notes/RELEASE.md
      # wins when its body actually changed since the last release tag. The build stamps the
      # version header itself - the old check made a human predict a git-height-derived version
      # number before it existed, which is why it silently fell back to git-cliff twice in a row.
      - name: Generate release notes
        id: notes
        shell: bash
        env:
          TAG: ${{ steps.info.outputs.tag }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          NOTES=docs/release_notes/RELEASE.md
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          DIFF_BASE=${PREV_TAG:-4b825dc642cb6eb9a060e54bf8d69288fbee4904}
          if [ -s "$NOTES" ] && ! git diff --quiet "$DIFF_BASE" HEAD -- "$NOTES"; then
            { printf '# Pia %s\n' "$VERSION"; tail -n +2 "$NOTES"; } > release-notes.md
            echo "release notes taken from $NOTES (stamped $VERSION)"
            echo "source=curated" >> "$GITHUB_OUTPUT"
          else
            if [ -f "$NOTES" ]; then
              echo "::warning::$NOTES has no unreleased changes since ${PREV_TAG:-repo start} - falling back to git-cliff"
            fi
            git cliff "${DIFF_BASE}..HEAD" --tag "$TAG" --strip header -o release-notes.md
            echo "source=cliff" >> "$GITHUB_OUTPUT"
          fi
          # Appended to BOTH branches, so it is read as raw text on storage.pia-ai.de as often as
          # it is rendered on GitHub. Hence a bare URL rather than a Markdown link.
          printf "\nFull changelog: https://github.com/Pia-Ai-dev/Pia.Wpf/blob/main/CHANGELOG.md\n" >> release-notes.md

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.info.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.info.outputs.title }}" \
            --notes-file release-notes.md \
            Releases/*.msi \
            Releases/*.nupkg \
            Releases/RELEASES \
            Releases/releases.*.json

      # docs/release_notes/README.md documents archiving RELEASE.md and emptying it after each
      # release; this is that step. [skip ci] keeps the bot commit from triggering its own build.
      - name: Archive release notes
        if: steps.notes.outputs.source == 'curated'
        shell: bash
        env:
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          ARCHIVE="docs/release_notes/$(date +%Y-%m-%d)-${VERSION}.md"
          cp docs/release_notes/RELEASE.md "$ARCHIVE"
          : > docs/release_notes/RELEASE.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$ARCHIVE" docs/release_notes/RELEASE.md
          git commit -m "docs: archive $VERSION release notes [skip ci]"
          git push

      # The mirror on pia-ai.de is published from the private Pia repo, which owns that step because the
      # Hetzner SSH key must not sit in a public repo. Triggering it is deliberately manual, so the notes
      # get a last read before they reach the website — this step only puts the link to press into the
      # run summary instead of relying on anyone remembering it. Setting PIA_DISPATCH_TOKEN (fine-grained,
      # Pia only, Contents: read and write) turns the same step into an automatic dispatch.
      - name: Link the pia-ai.de publish step
        shell: bash
        env:
          TAG: ${{ steps.info.outputs.tag }}
          GH_TOKEN: ${{ secrets.PIA_DISPATCH_TOKEN }}
          RELEASE_URL: https://github.com/Pia-Ai-dev/Pia.Wpf/releases/tag
          WORKFLOW_URL: https://github.com/Pia-Ai-dev/Pia/actions/workflows/publish-wpf-download.yml
        run: |
          set -euo pipefail
          if [ -n "${GH_TOKEN:-}" ]; then
            printf '{"event_type":"wpf-release","client_payload":{"tag":"%s"}}' "$TAG" > dispatch.json
            gh api repos/Pia-Ai-dev/Pia/dispatches --input dispatch.json
            echo "### pia-ai.de publish requested for $TAG" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Next step: publish $TAG to pia-ai.de"
            echo
            echo "1. Read over the [release notes]($RELEASE_URL/$TAG) and edit them if needed."
            echo "2. Run [Publish WPF Download]($WORKFLOW_URL) in Pia-Ai-dev/Pia, tag left blank."
            echo
            echo "The installers and version shown on pia-ai.de do not change until that runs."
          } >> "$GITHUB_STEP_SUMMARY"
